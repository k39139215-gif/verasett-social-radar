name: 24/7 Social Intent Radar

on:
  schedule:
    # Runs every 15 minutes automatically on GitHub cloud
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual run button from GitHub Actions UI

permissions:
  contents: write

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Radar Scan Cycle
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          python multi_platform_radar.py --once

      - name: Commit & Push New Leads
        run: |
          git config --global user.name "Verasett Radar Bot"
          git config --global user.email "bot@verasett.com"
          git add social_leads/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-harvest: Fresh social intent leads [skip ci]" && git push)
