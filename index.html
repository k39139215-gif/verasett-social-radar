<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verasett Social Intent Radar | Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-radar text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight">Verasett Social Radar</h1>
                    <p class="text-xs text-slate-400">Continuous AR Friction & Unapplied Cash Lead Monitor</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span>
                    24/7 Cloud Active
                </span>
                <button onclick="loadAllLeads()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Refresh</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Stats Bar -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
                <div class="text-xs text-slate-400 font-medium">Total Qualified Leads</div>
                <div id="statTotal" class="text-2xl font-bold mt-1 text-white">--</div>
            </div>
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
                <div class="text-xs text-rose-400 font-medium">Critical Pain (Score 9-10)</div>
                <div id="statCritical" class="text-2xl font-bold mt-1 text-rose-400">--</div>
            </div>
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
                <div class="text-xs text-indigo-400 font-medium">NetSuite Focused</div>
                <div id="statNetSuite" class="text-2xl font-bold mt-1 text-indigo-400">--</div>
            </div>
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
                <div class="text-xs text-slate-400 font-medium">Scan Cadence</div>
                <div class="text-2xl font-bold mt-1 text-emerald-400">10 Mins</div>
            </div>
        </div>

        <!-- Controls: Filters & Search -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
            <!-- Platform Tabs -->
            <div class="flex items-center space-x-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800 w-full md:w-auto overflow-x-auto">
                <button onclick="setFilter('all')" id="tab-all" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">All Leads</button>
                <button onclick="setFilter('reddit')" id="tab-reddit" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Reddit</button>
                <button onclick="setFilter('twitter')" id="tab-twitter" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Twitter / X</button>
                <button onclick="setFilter('linkedin')" id="tab-linkedin" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">LinkedIn</button>
                <button onclick="setFilter('producthunt')" id="tab-producthunt" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Product Hunt</button>
            </div>

            <!-- Search Input -->
            <div class="relative w-full md:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                <input type="text" id="searchInput" oninput="renderLeads()" placeholder="Search ERP, pain point, keywords..." 
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>

        <!-- Leads Grid -->
        <div id="leadsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-full py-12 text-center text-slate-500 text-sm">
                <i class="fa-solid fa-spinner animate-spin mr-2"></i> Loading live leads from social storage...
            </div>
        </div>
    </div>

    <script>
        let allLeads = [];
        let currentFilter = 'all';

        const platformFiles = {
            reddit: 'social_leads/reddit_leads.csv',
            twitter: 'social_leads/twitter_leads.csv',
            linkedin: 'social_leads/linkedin_leads.csv',
            producthunt: 'social_leads/producthunt_leads.csv'
        };

        function parseCSV(text, platform) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            const rows = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // Regex to handle quoted CSV fields
                const matches = line.match(/(?:\"[^\"]*\"|[^,])+/g);
                if (!matches) continue;
                
                const item = {};
                headers.forEach((h, idx) => {
                    let val = matches[idx] || '';
                    if (val.startsWith('"') && val.endsWith('"')) {
                        val = val.substring(1, val.length - 1).replace(/""/g, '"');
                    }
                    item[h] = val.trim();
                });
                if (item.post_title) {
                    item._sourcePlatform = platform;
                    rows.push(item);
                }
            }
            return rows;
        }

        async function loadAllLeads() {
            allLeads = [];
            for (const [platform, path] of Object.entries(platformFiles)) {
                try {
                    const resp = await fetch(path);
                    if (resp.ok) {
                        const csvText = await resp.text();
                        const parsed = parseCSV(csvText, platform);
                        allLeads.push(...parsed);
                    }
                } catch (e) {
                    console.log('Error loading ' + path, e);
                }
            }
            updateStats();
            renderLeads();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = allLeads.length;
            const critical = allLeads.filter(l => parseInt(l.pain_severity_score || '0') >= 9).length;
            document.getElementById('statCritical').innerText = critical;
            const netsuite = allLeads.filter(l => (l.target_erp || '').toLowerCase().includes('netsuite') || (l.post_title || '').toLowerCase().includes('netsuite')).length;
            document.getElementById('statNetSuite').innerText = netsuite;
        }

        function setFilter(platform) {
            currentFilter = platform;
            ['all', 'reddit', 'twitter', 'linkedin', 'producthunt'].forEach(p => {
                const tab = document.getElementById('tab-' + p);
                if (p === platform) {
                    tab.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition';
                } else {
                    tab.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition';
                }
            });
            renderLeads();
        }

        function renderLeads() {
            const container = document.getElementById('leadsContainer');
            const search = (document.getElementById('searchInput').value || '').toLowerCase();
            
            let filtered = allLeads.filter(l => {
                if (currentFilter !== 'all' && l._sourcePlatform !== currentFilter) return false;
                if (!search) return true;
                const haystack = `${l.post_title} ${l.full_body_excerpt} ${l.detected_pain_point} ${l.target_erp} ${l.author}`.toLowerCase();
                return haystack.includes(search);
            });

            // Sort by severity score desc
            filtered.sort((a, b) => parseInt(b.pain_severity_score || '0') - parseInt(a.pain_severity_score || '0'));

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500 text-sm">No qualified leads match current filters.</div>';
                return;
            }

            container.innerHTML = filtered.map(lead => {
                const score = parseInt(lead.pain_severity_score || '7');
                const scoreBadgeColor = score >= 9 ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' : 
                                      score >= 7 ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 
                                                   'bg-blue-500/10 text-blue-400 border-blue-500/20';

                let platformIcon = 'fa-globe';
                let platformColor = 'text-slate-400';
                if (lead._sourcePlatform === 'reddit') { platformIcon = 'fa-reddit'; platformColor = 'text-orange-500'; }
                else if (lead._sourcePlatform === 'twitter') { platformIcon = 'fa-x-twitter'; platformColor = 'text-sky-400'; }
                else if (lead._sourcePlatform === 'linkedin') { platformIcon = 'fa-linkedin'; platformColor = 'text-blue-500'; }
                else if (lead._sourcePlatform === 'producthunt') { platformIcon = 'fa-product-hunt'; platformColor = 'text-amber-500'; }

                return `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center space-x-2">
                                <i class="fa-brands ${platformIcon} ${platformColor} text-base"></i>
                                <span class="text-xs font-semibold text-slate-300">${lead.author || 'Anonymous'}</span>
                                <span class="text-[10px] text-slate-500">&bull; ${lead.timestamp || ''}</span>
                            </div>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${scoreBadgeColor}">
                                Severity ${score}/10
                            </span>
                        </div>

                        <h3 class="font-bold text-sm text-slate-100 mb-2 leading-snug">
                            ${lead.post_title}
                        </h3>

                        <p class="text-xs text-slate-400 mb-4 line-clamp-3 leading-relaxed">
                            "${lead.full_body_excerpt}"
                        </p>

                        <div class="flex flex-wrap gap-1.5 mb-4">
                            <span class="px-2 py-0.5 rounded-md text-[10px] font-medium bg-slate-800 text-indigo-300 border border-slate-700">
                                <i class="fa-solid fa-server mr-1 text-[9px]"></i>${lead.target_erp || 'ERP'}
                            </span>
                            <span class="px-2 py-0.5 rounded-md text-[10px] font-medium bg-slate-800 text-rose-300 border border-slate-700">
                                <i class="fa-solid fa-triangle-exclamation mr-1 text-[9px]"></i>${lead.detected_pain_point || 'Friction'}
                            </span>
                        </div>

                        <div class="p-3 rounded-lg bg-slate-950/70 border border-slate-800/80 mb-4">
                            <div class="text-[10px] uppercase font-bold tracking-wider text-indigo-400 mb-1 flex items-center justify-between">
                                <span><i class="fa-solid fa-lightbulb mr-1"></i>Founder Advisory Perspective</span>
                                <button onclick="copyToClipboard('${escape(lead.recommended_advisory_angle || '')}', this)" class="text-[9px] hover:text-white transition">
                                    <i class="fa-regular fa-copy mr-0.5"></i> Copy Angle
                                </button>
                            </div>
                            <p class="text-xs text-slate-300 italic">
                                "${lead.recommended_advisory_angle || ''}"
                            </p>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-800/60 flex items-center justify-between">
                        <span class="text-[11px] text-slate-500">Zero automated outreach</span>
                        <a href="${lead.post_url}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center space-x-1.5 text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition">
                            <span>Open Thread</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                </div>`;
            }).join('');
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(unescape(text));
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Copied!';
            setTimeout(() => { btn.innerHTML = orig; }, 2000);
        }

        window.onload = loadAllLeads;
    </script>
</body>
</html>
